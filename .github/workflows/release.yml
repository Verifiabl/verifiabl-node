name: Release

# Publishes to npm when a GitHub release is published.
#
# Auth uses npm "trusted publishing" (OIDC), with no long-lived token secret.
# One-time setup on npmjs.com after the first manual publish of "@verifiabl/issuer":
#   @verifiabl/issuer package Settings → Trusted Publisher → GitHub Actions
#   repository: Verifiabl/verifiabl-node, workflow: release.yml,
#   environment: npm-publish
#
# The npm-publish GitHub environment (repo Settings → Environments) requires a
# reviewer approval, so publishing a GitHub release alone cannot push to npm
# without a human confirming the deployment.
on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.tag_name }}

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: npm-publish
    permissions:
      contents: read
      id-token: write # OIDC token for npm provenance + trusted publishing
    steps:
      # Default checkout (no `ref:`). On `release` events actions/checkout
      # >=6.0.2 keeps the tag ref so npm provenance gets a SourceRepositoryRef.
      # Passing an explicit `ref:` forces a detached checkout at the bare SHA,
      # which drops that ref again and makes npm reject the bundle with
      # "Missing SourceRepositoryRef" (npm/cli#8699). Pinned >=6.0.2 here.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: pnpm
      # The validator and target policy are shipped with this repository.
      - name: Validate the release target and tag checkout
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: node .github/scripts/release-tool.mjs validate-checkout "$TAG"
      - run: pnpm install --frozen-lockfile
      - name: Verify tracked release sources are clean
        run: node .github/scripts/release-tool.mjs verify-clean
      # A release tag is necessarily a detached checkout, so pnpm's
      # branch-oriented Git check cannot apply. The steps above explicitly
      # validate the tag commit and clean tree before trusted publishing.
      # prepublishOnly runs typecheck, tests, build, and package export checks.
      # Stable releases explicitly update latest; prereleases use next so a
      # release candidate can never become the default npm version by accident.
      - name: Select npm dist-tag
        run: |
          if [[ "$VERSION" == *-* ]]; then
            echo "NPM_TAG=next" >>"$GITHUB_ENV"
          else
            echo "NPM_TAG=latest" >>"$GITHUB_ENV"
          fi
      - run: pnpm publish --provenance --access public --no-git-checks --tag "$NPM_TAG"
