name: CodeQL

# Static analysis (SAST) on every PR and on main, per the ISMS SDLC
# policy requirement that SAST and SCA run before merge (SCA is the
# pnpm audit job in ci.yml).
on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "30 18 * * 1" # weekly, Tuesday 04:30 AEST

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 26
          cache: pnpm
      # Installed dependencies let CodeQL resolve imports/types fully.
      - run: pnpm install --frozen-lockfile
      - uses: github/codeql-action/init@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        with:
          languages: javascript-typescript
          queries: security-and-quality
      - uses: github/codeql-action/analyze@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
